name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Lint
        run: uv run --locked --only-group lint ruff check .

      - name: Check formatting
        run: uv run --locked --only-group lint ruff format --check .

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Bandit
        run: uv run --locked --only-group lint bandit -r qtempo

  typecheck:
    name: Pyright (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    strategy:
      fail-fast: false
      matrix:
        qgis: ["3.34-noble", "ltr", "stable"]
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Create venv on top of the system QGIS
        run: uv venv --system-site-packages --python /usr/bin/python3

      - name: Install dependencies
        run: uv sync --locked

      - name: Pyright
        run: uv run pyright

  test:
    name: Pytest (QGIS ${{ matrix.qgis }})
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    strategy:
      fail-fast: false
      matrix:
        qgis: ["3.34-noble", "ltr", "stable"]
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Create venv on top of the system QGIS
        run: uv venv --system-site-packages --python /usr/bin/python3

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

  pyqt6:
    name: PyQt6 compatibility
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/oslandia/qgis/pyqgis-4-checker/pyqgis-qt-checker:latest
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - name: Check PyQt5 to PyQt6 compatibility
        run: |
          pyqt5_to_pyqt6.py --dry_run qtempo
          pyqt5_to_pyqt6.py qtempo
